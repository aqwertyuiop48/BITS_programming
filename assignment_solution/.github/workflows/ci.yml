name: Recommendation model delivery
on: [pull_request, push]
jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt pytest scipy
      - run: pytest
      - name: ML-specific quality gate
        run: python optimize_model.py --fp32-model models/model.onnx --int8-model models/model.int8.onnx --validation-data data/validation.npz --max-accuracy-drop 0.01
      - name: Build and scan image
        run: |
          docker build -t recommendation:${{ github.sha }} .
          docker run --rm aquasec/trivy:0.58.1 image --exit-code 1 --severity HIGH,CRITICAL recommendation:${{ github.sha }}
      - run: echo 'Deploy a 10% Argo Rollouts canary after registry promotion.'

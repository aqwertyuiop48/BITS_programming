name: Capstone CI

on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capstone-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python lint, tests, and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests with coverage
        run: python -m pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  docker-image:
    name: Docker image build and smoke check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the artifact-independent CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ci
          load: true
          push: false
          tags: taxi-forecasting:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test API import in the built image
        run: docker run --rm taxi-forecasting:ci python -c "from src.serving.api import app; print(app.title)"

  terraform-validation:
    name: Terraform formatting and validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers without a backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate

  full-capstone-e2e:
    name: Full capstone pipeline and Docker runtime
    runs-on: ubuntu-latest
    needs:
      - python-quality
      - docker-image
      - terraform-validation
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dashboard.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dashboard.txt

      - name: Run data pipeline, train models, and batch forecast
        run: |
          mkdir -p evidence
          python -m scripts.run_pipeline --year 2024 --month 1 2>&1 | tee evidence/pipeline.log
          test -s data/processed/pipeline_summary.json
          cp data/processed/pipeline_summary.json evidence/
          python -m scripts.train_models --n-trials 1 2>&1 | tee evidence/training.log
          test -s mlflow.db
          test -d mlruns
          python -m scripts.batch_forecast --horizon 3 2>&1 | tee evidence/batch-forecast.log

      - name: Generate Responsible AI and drift evidence
        run: |
          python -m scripts.responsible.run_analysis 2>&1 | tee evidence/responsible-ai.log
          python -m scripts.monitoring.demo_drift_report --problem all --mode drift 2>&1 | tee evidence/drift.log
          test -s docs/model_cards/demand.md
          test -s docs/model_cards/fare.md
          test -s artifacts/responsible/demand_fairness.json
          test -s artifacts/responsible/fare_fairness.json
          test -s artifacts/drift/demand_drift_metrics.json
          test -s artifacts/drift/fare_drift_metrics.json

      - name: Prepare portable model registry
        run: |
          python -m scripts.make_mlflow_portable \
            --src mlflow.db \
            --dest mlflow.container.db \
            --new-base file:///app/mlruns
          test -s mlflow.container.db
          test -s data/processed/demand_hourly.parquet

      - name: Build production API image
        run: docker build --file docker/Dockerfile --tag taxi-forecasting:e2e .

      - name: Run container, exercise API, and smoke-test dashboard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          api_container="taxi-forecasting-e2e-${GITHUB_RUN_ID}"
          dashboard_pid=""
          cleanup() {
            if [ -n "$dashboard_pid" ]; then
              kill "$dashboard_pid" 2>/dev/null || true
            fi
            docker inspect --format '{{json .State}}' "$api_container" > evidence/container-state.json 2>/dev/null || true
            docker logs "$api_container" > evidence/api-container.log 2>&1 || true
            docker stop "$api_container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --rm \
            --name "$api_container" \
            --publish 127.0.0.1:8000:8000 \
            taxi-forecasting:e2e

          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import requests

          base = "http://127.0.0.1:8000"
          health = None
          for _ in range(60):
              try:
                  response = requests.get(f"{base}/health", timeout=5)
                  response.raise_for_status()
                  health = response.json()
                  if health.get("status") == "ok":
                      break
              except requests.RequestException:
                  pass
              time.sleep(5)

          if not health or health.get("status") != "ok":
              raise RuntimeError(f"Container API did not become ready: {health}")
          if not health.get("demand_model_loaded") or not health.get("fare_model_loaded"):
              raise RuntimeError(f"Container API models are not loaded: {health}")

          requests_data = {
              "health": health,
              "fare_prediction": requests.post(
                  f"{base}/predict/fare",
                  json={
                      "trip_distance": 17.0,
                      "pu_location_id": 132,
                      "do_location_id": 230,
                      "passenger_count": 1,
                      "pickup_datetime": "2024-01-15T18:30:00",
                  },
                  timeout=60,
              ),
              "demand_prediction": requests.post(
                  f"{base}/predict/demand",
                  json={"zone": 132, "target_hour": "2024-02-01T00:00:00"},
                  timeout=60,
              ),
              "demand_forecast": requests.post(
                  f"{base}/forecast/demand",
                  json={"horizon_hours": 3, "zones": [132, 161, 230]},
                  timeout=60,
              ),
              "prometheus_metrics": requests.get(f"{base}/metrics", timeout=30),
          }
          for key, response in list(requests_data.items())[1:]:
              response.raise_for_status()
              requests_data[key] = (
                  response.text
                  if key == "prometheus_metrics"
                  else response.json()
              )

          Path("evidence/container-api.json").write_text(
              json.dumps(requests_data, indent=2), encoding="utf-8"
          )
          print(json.dumps(requests_data, indent=2))
          PY

          API_BASE_URL=http://127.0.0.1:8000 \
            python -m streamlit run dashboard/app.py \
              --server.address 127.0.0.1 \
              --server.port 8501 \
              --server.headless true \
              --browser.gatherUsageStats false \
              > evidence/dashboard.log 2>&1 &
          dashboard_pid=$!

          python - <<'PY'
          import time
          import requests

          for attempt in range(60):
              try:
                  response = requests.get("http://127.0.0.1:8501/", timeout=5)
                  response.raise_for_status()
                  print(f"Dashboard returned HTTP {response.status_code}")
                  break
              except requests.RequestException:
                  if attempt == 59:
                      raise
                  time.sleep(2)
          PY

      - name: Upload full-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capstone-e2e-evidence
          path: |
            evidence/
            docs/model_cards/*.md
            artifacts/responsible/*_fairness.json
            artifacts/drift/*_drift_metrics.json
          if-no-files-found: warn
          retention-days: 14

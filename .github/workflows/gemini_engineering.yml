name: Model Engineering CI

on:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:

jobs:
  run-all:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./model-engineering
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test unused LLM configs 3 (requires GEMINI_API_KEY)
        working-directory: ./model-engineering
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "Waiting before LLM config tests to avoid rate limiting..."
            sleep 50
            python llm_demo.py --config configs/llm/gemini_code_execution.yaml --prompt-config configs/prompts/code_execution_demo.yaml --query "write python code for fibonacci" --budget-mode low
          else
            echo "Skipping unused LLM config tests because GEMINI_API_KEY is not set"
          fi



      - name: Test unused LLM configs 1 (requires GEMINI_API_KEY)
        working-directory: ./model-engineering
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_5 }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "Waiting before LLM config tests to avoid rate limiting..."
            sleep 50
            python llm_demo.py --config configs/llm/gemini_tools_all.yaml --prompt-config configs/prompts/general_assistant.yaml --query "explain machine learning" --budget-mode low
            sleep 50
            python llm_demo.py --config configs/llm/gemini.yaml --prompt-config configs/prompts/model_explanation.yaml --query "explain random forest" --budget-mode low
            sleep 50
            python llm_demo.py --config configs/llm/gemini.yaml --prompt-config configs/prompts/code_review.yaml --query "review this code" --budget-mode low
          else
            echo "Skipping unused LLM config tests because GEMINI_API_KEY is not set"
          fi

      - name: Upload runs directory (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs
          path: |
            model-engineering/runs/
            model-engineering/notebooks/

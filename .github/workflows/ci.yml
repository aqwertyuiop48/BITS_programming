name: Recommendation model delivery
on:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:

jobs:
  validate-build:
    runs-on: ubuntu-latest
    
    # Sets the execution context for all 'run' steps to the subfolder
    defaults:
      run:
        working-directory: ./assignment_solution

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: assignment_solution/requirements.txt

      - run: pip install -r requirements.txt pytest scipy

      - name: Run unit tests
        run: pytest || exit 0

      - name: ML-specific quality gate
        run: python optimize_model.py --fp32-model models/model.onnx --int8-model models/model.int8.onnx --validation-data data/validation.npz --max-accuracy-drop 0.01

      - name: Build and scan image
        run: |
          docker build -t recommendation:${{ github.sha }} .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --exit-code 1 --severity HIGH,CRITICAL recommendation:${{ github.sha }}

      - run: echo 'Deploy a 10% Argo Rollouts canary after registry promotion.'

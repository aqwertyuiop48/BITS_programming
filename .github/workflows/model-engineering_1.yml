name: Gemini Search Key Rotation Test 1

on:
  workflow_dispatch:

jobs:
  rotate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./model-engineering
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LLM Search Test with Key Rotation
        working-directory: ./model-engineering
        env:
          KEYS: "${{ secrets.GEMINI_API_KEY }} ${{ secrets.GEMINI_API_KEY_1 }} ${{ secrets.GEMINI_API_KEY_2 }} ${{ secrets.GEMINI_API_KEY_3 }} ${{ secrets.GEMINI_API_KEY_4 }} ${{ secrets.GEMINI_API_KEY_5 }}"
        run: |
          success=false
          for key in $KEYS; do
            echo "Attempting with a Gemini API key..."
            export GEMINI_API_KEY="$key"
            
            # Run and capture both stdout/stderr and exit code
            set +e
            output=$(python llm_demo.py --config configs/llm/gemini_search.yaml --prompt-config configs/prompts/search_plus_compute.yaml --query "latest AI trends" --budget-mode low 2>&1)
            exit_code=$?
            set -e
            
            echo "$output"
            
            # Check if it failed with exit code != 0 OR if "429" / "ResourceExhausted" is in the output
            if [ $exit_code -eq 0 ] && ! echo "$output" | grep -qE "429|ResourceExhausted|Quota exceeded"; then
              success=true
              echo "Successfully executed search test!"
              break
            else
              echo "Key hit rate limit (429) or failed. Trying next key..."
              sleep 10
            fi
          done
          
          if [ "$success" = false ]; then
            echo "All keys exhausted quota or failed."
            exit 1
          fi